<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0E6FC4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Technician" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Oasis Globe — Technician App</title>
    <script>
      // Before React boots: restore #/job/… after camera/gallery killed the WebView.
      (function () {
        try {
          var busy = localStorage.getItem("og-tech-photo-busy");
          var path = localStorage.getItem("og-tech-resume-path");
          if (busy !== "1" || !path || path.indexOf("/job/") !== 0) return;
          var want = "#" + path;
          if (location.hash !== want) {
            location.replace(location.pathname + location.search + want);
          }
        } catch (e) {}
      })();
    </script>
